<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Lanora - Sweet Memories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Shared SVG symbols -->
    <svg
      width="0"
      height="0"
      style="position: absolute"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <symbol id="wordmark" viewBox="0 0 196 40">
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="5.5"
            stroke-linejoin="miter"
            stroke-linecap="butt"
          >
            <path d="M5 3 V37 H23" />
            <path d="M30 37 L43 3 L56 37 M34.5 27 H51.5" />
            <path d="M67 37 V3 L88 37 V3" />
            <circle cx="108" cy="20" r="14.5" />
            <path d="M93.5 26 H122.5" stroke-width="4.5" />
            <path
              d="M134 37 V3 H146 A8.5 8.5 0 0 1 146 20 H134 M146 20 L158 37"
            />
            <path d="M166 37 L179 3 L192 37 M170.5 27 H187.5" />
          </g>
        </symbol>
        <symbol id="i-instagram" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
          </g>
          <circle cx="17.3" cy="6.7" r="1.3" fill="currentColor" />
        </symbol>
        <symbol id="i-whatsapp" viewBox="0 0 24 24">
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          >
            <path d="M3.5 20.5l1.3-4.5A8.5 8.5 0 1 1 8.2 19.3z" />
          </g>
          <path
            d="M9 8.2c-.4 1.2 0 2.6 1.4 4.1 1.5 1.5 3 2.2 4.2 1.8l.9-1c.1-.2 0-.4-.2-.5l-1.5-.7c-.2-.1-.4 0-.5.1l-.5.6c-1-.4-1.9-1.3-2.3-2.3l.6-.5c.2-.1.2-.3.1-.5l-.7-1.5c-.1-.2-.3-.3-.5-.2z"
            fill="currentColor"
          />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M12 21.5c-4-4.4-6.5-7.8-6.5-11.2a6.5 6.5 0 0 1 13 0c0 3.400-2.500 6.800-6.500 11.200z"
            />
            <circle cx="12" cy="10" r="2.500" />
          </g>
        </symbol>
        <symbol id="i-cart" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6" />
            <circle cx="10" cy="21" r="1" />
            <circle cx="18" cy="21" r="1" />
          </g>
        </symbol>
        <symbol id="i-menu" viewBox="0 0 24 24">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            fill="none"
          />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path
            d="M5 5l14 14M19 5L5 19"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="square"
            fill="none"
          />
        </symbol>
        <symbol id="i-arrow-r" viewBox="0 0 24 24">
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9.5" />
            <path d="M8 12h8M12.500 8.500L16 12l-3.500 3.500" />
          </g>
        </symbol>
        <symbol id="i-arrow-l" viewBox="0 0 24 24">
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9.5" />
            <path d="M16 12H8M11.500 8.500L8 12l3.500 3.500" />
          </g>
        </symbol>
      </defs>
    </svg>

    <header class="site-header">
      <a class="logo-link" href="#/" aria-label="Lanora home">
        <img src="images/lanorablack@4x-8.png" alt="Lanora" />
      </a>

      <div class="header-actions">
        <button class="cart-toggle" id="openCart" type="button" aria-haspopup="dialog" aria-controls="cartDialog" aria-label="Open cart">
          <svg aria-hidden="true"><use href="#i-cart" /></svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
        <div class="lang-toggle" aria-label="Language selector">
          <button
            class="lang-btn is-active"
            type="button"
            data-lang="fr"
            aria-pressed="true"
          >
            <span class="lang-full">Français</span>
            <span class="lang-abbr" aria-hidden="true">FR</span>
          </button>
          <button
            class="lang-btn"
            type="button"
            data-lang="en"
            aria-pressed="false"
          >
            <span class="lang-full">English</span>
            <span class="lang-abbr" aria-hidden="true">EN</span>
          </button>
        </div>

        <button
          class="icon-btn"
          id="openMenu"
          aria-label="Open menu"
          aria-haspopup="dialog"
          aria-controls="overlay"
        >
          <svg><use href="#i-menu" /></svg>
        </button>
      </div>
    </header>

    <div
      class="overlay"
      id="overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Site menu"
    >
      <button class="icon-btn close" id="closeMenu" aria-label="Close menu">
        <svg><use href="#i-close" /></svg>
      </button>
      <a class="logo logo-link" href="#/" aria-label="Lanora home">
        <img src="images/lanorablack@4x-8.png" alt="Lanora" />
      </a>
      <nav id="overlayNav" aria-label="Menu sections"></nav>
      <div class="socials" id="overlaySocials"></div>
    </div>

    <main id="main" tabindex="-1"></main>

    <dialog class="cart-dialog" id="cartDialog" aria-labelledby="cartTitle">
      <div class="cart-panel">
        <header class="cart-header">
          <div>
            <h2 id="cartTitle">Your order</h2>
            <p class="cart-note" id="cartNote">Show this list to your waiter.</p>
          </div>
          <button class="cart-close" id="closeCart" type="button" aria-label="Close cart">&times;</button>
        </header>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-summary">
          <button class="cart-clear" id="clearCart" type="button">Clear order</button>
        </div>
      </div>
    </dialog>

    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-map">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3297.544463893633!2d-6.593556988045533!3d34.2601657729672!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xda759dbaf268b63%3A0x33d38a7b9de7fefd!2sLanora%20Ice%20Cream!5e0!3m2!1sfr!2sma!4v1790710222732!5m2!1sfr!2sma"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
        <div class="socials" id="footerSocials"></div>
      </div>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
